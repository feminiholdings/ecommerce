<!DOCTYPE html>
<html lang="en">
<head>

<title>Naisiae Textiles</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;900&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; background:#e8ebf5; font-family:'Montserrat','Arial Black','Segoe UI',Arial,sans-serif;font-weight:900; }
  a { text-decoration:none; }
  h1, h2, h3 { font-family:'Montserrat', sans-serif; font-weight:900; letter-spacing:-0.05em; }
  @media only screen and (max-width:620px) {
    .card { width:100% !important; }
    .pad { padding:24px 20px !important; }

<body style="margin:0;padding:0;background:#e8ebf5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#e8ebf5;">

              </tr>
            </table>
          </td>
        </tr>

        <!-- HEADER BAR -->
        <tr>
          <td style="background:#030A91;padding:22px 28px 14px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="text-align:center;padding-bottom:8px;">
                  <img src="https://plain-eeur-prod-public.komododecks.com/202605/07/1sm3ITZIdJmYjyTcxmiP/image.png" alt="Naisiae Textiles" width="64" style="display:block;margin:0 auto;border:0;width:64px;height:auto;">

              </tr>
              <tr>
                <td align="center" style="text-align:center;">
                  <div style="color:#ffffff;font-size:24px;font-weight:800;letter-spacing:1.5px;text-align:center;font-family:'Montserrat','Arial Black',Arial,sans-serif;">NAISIAE TEXTILES</div>
                  <div style="color:#c9cffa;font-size:12px;letter-spacing:0.5px;text-align:center;">Uhuru Market Uniforms &bull; Nairobi, Kenya</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        
        <!-- BODY CONTENT AREA -->
        <tr>
          <td class="pad" style="padding:24px 32px 40px;color:#222222;font-size:15px;line-height:1.6;font-weight:600;font-family:'Montserrat','Segoe UI',Arial,sans-serif;">
            <!-- PLACEHOLDER FOR BODY CONTENT -->
            {{BODY_CONTENT}}
          </td>
        </tr>

        <!-- BOTTOM NAV -->
        <tr>
          <td style="background:#030A91;padding:0;">
            <table role="presentation" class="nav" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="padding:16px 6px;border-right:1px solid #2a35b5;">
                  <a href="https://naisiaetextiles.com" style="color:#ffffff;font-size:13px;font-weight:800;font-family:'Montserrat','Arial Black',Arial,sans-serif;">Home</a>
                </td>
                <td align="center" style="padding:16px 6px;border-right:1px solid #2a35b5;">
                  <a href="https://naisiaetextiles.com/school-uniforms" style="color:#ffffff;font-size:13px;font-weight:800;font-family:'Montserrat','Arial Black',Arial,sans-serif;">School Uniforms</a>
                </td>
                <td align="center" style="padding:16px 6px;border-right:1px solid #2a35b5;">
                  <a href="https://naisiaetextiles.com/customized-uniforms" style="color:#ffffff;font-size:13px;font-weight:800;font-family:'Montserrat','Arial Black',Arial,sans-serif;">Customized</a>

                <td align="center" style="padding:16px 6px;">

                </td>
              </tr>
            </table>
          </td>

            <a href="https://naisiaetextiles.com" style="color:#030A91;">naisiaetextiles.com</a><br><br>
            <span style="font-size:11px;color:#999999;">&copy; 2026 Naisiae Textiles. All rights reserved.</span>
